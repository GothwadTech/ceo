      try {
        const preference = localStorage.getItem('ceo-profile-theme');
        if (preference === 'light' || preference === 'dark') {
          document.documentElement.setAttribute('data-theme', preference);
        }
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = preference === 'dark' || (preference !== 'light' && prefersDark);
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDark ? '#212121' : '#f7f7f2');
      } catch {
        // The stylesheet still follows the device theme if storage is unavailable.
      }
    </script>
